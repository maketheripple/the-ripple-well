<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ripple Reflections — Make the Ripple</title>

    <meta
        name="description"
        content="Ripple Reflections — Make the Ripple's stories, conversations, and community segments."
    >

    <style>
*{box-sizing:border-box}
html{margin:0;padding:0;scroll-behavior:smooth;background:#01050b}
body{
    margin:0;
    color:#eefaff;
    font-family:Georgia,"Times New Roman",serif;
    overflow-x:hidden;
    background:#01050b;
}

/* =========================
   STANDARD MAKE THE RIPPLE HEADER
   ========================= */
#homebase-header{
    position:absolute;
    z-index:1000;
    top:0;
    left:0;
    width:100%;
    height:92px;
    display:flex;
    align-items:center;
    padding:10px 7vw;
    gap:35px;
    background:linear-gradient(to bottom,rgba(1,8,15,.82),rgba(1,8,15,.10),transparent);
    pointer-events:none;
}
#homebase-header>*{pointer-events:auto}
.brand-link{
    position:relative;
    display:flex;
    align-items:center;
    flex:0 0 auto;
    width:225px;
    z-index:1;
}
.brand-link::before{
    content:"";
    position:absolute;
    left:50%;
    top:calc(50% + 42px);
    width:245px;
    height:175px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(
        ellipse,
        rgba(74,220,248,.42) 0%,
        rgba(74,220,248,.24) 28%,
        rgba(74,220,248,.10) 52%,
        transparent 76%
    );
    filter:blur(12px);
    pointer-events:none;
    z-index:-1;
}
.brand-link img{
    position:relative;
    width:225px;
    height:auto;
    display:block;
    transform:translateY(85px);
    filter:
        drop-shadow(0 0 10px rgba(55,219,246,.8))
        drop-shadow(0 0 24px rgba(55,219,246,.55))
        drop-shadow(0 0 42px rgba(55,219,246,.32));
}
.desktop-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(10px,2.3vw,38px);
    flex:1;
    font-size:14px;
    letter-spacing:.11em;
    text-transform:uppercase;
    white-space:nowrap;
}
.desktop-nav a{
    color:inherit;
    text-decoration:none;
    opacity:.9;
    transition:.25s ease;
}
.desktop-nav a:hover{
    opacity:1;
    color:#59e8ff;
    text-shadow:0 0 12px rgba(70,224,250,.6);
}
.header-actions{
    display:flex;
    align-items:center;
    gap:22px;
}
#make-ripple-button{
    padding:12px 25px;
    border:1px solid rgba(82,229,255,.9);
    border-radius:30px;
    background:rgba(2,15,25,.38);
    color:#eefaff;
    text-transform:uppercase;
    letter-spacing:.12em;
    font-size:13px;
    cursor:pointer;
    box-shadow:0 0 10px rgba(50,211,243,.08);
    backdrop-filter:blur(5px);
}
#make-ripple-button:hover{
    background:rgba(16,55,68,.55);
    box-shadow:0 0 25px rgba(50,211,243,.28);
}
.menu-button{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    display:grid;
    align-content:center;
    gap:6px;
    cursor:pointer;
}
.menu-button span{
    display:block;
    width:30px;
    height:2px;
    background:#eefaff;
    margin:auto;
    box-shadow:0 0 7px rgba(255,255,255,.25);
}

/* =========================
   PAGE BACKGROUND
   ========================= */
#reflection-page{
    position:relative;
    min-height:1000vh;
    background-image:
        linear-gradient(to bottom,rgba(0,8,16,.10),rgba(0,8,16,.18)),
        url("images/ripple-reflections-background.png");
    background-repeat:no-repeat;
    background-position:center top;
    background-size:100% 100%;
    background-color:#01050b;
}

/* Subtle readability layer behind future segment content */
.reflection-content{
    position:relative;
    z-index:5;
    width:min(1100px,88vw);
    margin:0 auto;
    padding-top:34vh;
    padding-bottom:18vh;
}

.reflection-intro{
    min-height:78vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    text-align:center;
    padding-top:170px;
}
.reflection-intro-inner{
    width:min(1050px,94vw);
    padding:20px 20px 50px;
}
.reflection-logo{
    display:block;
    width:min(760px,86vw);
    max-height:52vh;
    height:auto;
    object-fit:contain;
    margin:0 auto;
    filter:drop-shadow(0 14px 32px rgba(0,0,0,.30));
}

.segment{
    min-height:82vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8vh 0;
}
.segment-card{
    width:min(1000px,100%);
    min-height:60vh;
    padding:35px 25px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}
.segment-logo{
    display:block;
    width:min(380px,44vw);
    max-height:29vh;
    height:auto;
    object-fit:contain;
    filter:drop-shadow(0 12px 28px rgba(0,0,0,.24));
    transition:transform .3s ease,filter .3s ease;
}
.segment-logo:hover{
    transform:scale(1.015);
    filter:drop-shadow(0 15px 34px rgba(0,0,0,.30));
}

/* =========================
   STANDARD BOTTOM BAR
   ========================= */
#homebase-footer{
    position:relative;
    z-index:1100;
    width:100%;
    height:72px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding:0 5vw;
    background:rgba(1,6,12,.92);
    border-top:1px solid rgba(61,208,239,.38);
    backdrop-filter:blur(7px);
}
.contact-link{
    color:#eefaff;
    text-decoration:none;
    font-size:16px;
    letter-spacing:.08em;
    border-left:1px solid rgba(65,212,240,.45);
    padding-left:28px;
}
.contact-link:hover{
    color:#63e6ff;
}

/* =========================
   FULL-SCREEN MENU
   ========================= */
#menu-overlay{
    position:fixed;
    inset:0;
    z-index:2500;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,5,12,.94);
    backdrop-filter:blur(12px);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .35s ease,visibility .35s ease;
}
#menu-overlay.open{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}
.menu-panel{
    width:min(760px,88vw);
    text-align:center;
    padding:70px 30px 55px;
    position:relative;
}
.menu-close{
    position:absolute;
    right:0;
    top:0;
    width:46px;
    height:46px;
    border:1px solid rgba(110,225,246,.45);
    border-radius:50%;
    background:rgba(2,15,25,.4);
    color:#eefaff;
    font:32px/1 Arial,sans-serif;
    cursor:pointer;
}
.menu-close:hover{
    border-color:#63e6ff;
    box-shadow:0 0 10px rgba(70,224,250,.35);
}
.menu-kicker{
    font-size:12px;
    letter-spacing:.38em;
    text-transform:uppercase;
    opacity:.6;
    margin-bottom:10px;
}
.menu-title{
    margin:0 0 45px;
    font-size:clamp(34px,5vw,58px);
    font-weight:400;
    letter-spacing:.16em;
    text-shadow:0 0 20px rgba(92,210,255,.35);
}
.menu-links{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
}
.menu-links a{
    color:inherit;
    text-decoration:none;
    font-size:clamp(20px,3vw,30px);
    letter-spacing:.2em;
    text-transform:uppercase;
    transition:.25s ease;
}
.menu-links a:hover{
    color:#63e6ff;
    text-shadow:0 0 10px rgba(70,224,250,.65);
    transform:translateY(-2px);
}

/* =========================
   RESPONSIVE
   ========================= */
@media(max-width:1050px){
    #homebase-header{
        padding:16px 4vw;
        gap:15px;
    }
    .brand-link,
    .brand-link img{
        width:190px;
    }
    .brand-link::before{
        width:215px;
        height:155px;
    }
    .brand-link img{
        transform:translateY(55px);
    }
    .desktop-nav{
        gap:14px;
        font-size:11px;
    }
    .header-actions{
        gap:10px;
    }
    #make-ripple-button{
        padding:10px 14px;
        font-size:11px;
    }
}

@media(max-width:760px){
    #homebase-header{
        height:75px;
        padding:10px 5vw;
    }
    .brand-link,
    .brand-link img{
        width:77.5px;
    }
    .brand-link::before{
        width:88px;
        height:63px;
        top:calc(50% + 14px);
    }
    .brand-link img{
        transform:translateY(22.5px);
    }
    .desktop-nav{
        display:none;
    }
    .header-actions{
        margin-left:auto;
    }
    #make-ripple-button{
        position:fixed;
        left:10px;
        bottom:10px;
        z-index:1200;
        font-size:10px;
        padding:9px 12px;
    }
    .menu-button{
        width:34px;
    }

    #reflection-page{
        min-height:1000vh;
        background-size:auto 100%;
        background-position:center top;
    }

    .reflection-content{
        width:min(94vw,700px);
        padding-top:0;
        padding-bottom:8vh;
    }
    .reflection-intro{
        min-height:70vh;
        padding-top:125px;
    }
    .reflection-intro-inner{
        padding:10px 5px 35px;
    }
    .reflection-logo{
        width:min(88vw,650px);
        max-height:84vh;
    }
    .segment{
        min-height:76vh;
        padding:5vh 0;
    }
    .segment-card{
        min-height:54vh;
        padding:25px 5px;
    }
    .segment-logo{
        width:min(44vw,325px);
        max-height:12vh;
    }

    #homebase-footer{
        height:64px;
        padding:0 5vw;
    }
    .contact-link{
        font-size:12px;
        padding-left:12px;
    }
}
    </style>
</head>

<script>
(() => {
    const menu = document.getElementById("menu-overlay");
    const openButton = document.getElementById("menu-button");
    const closeButton = document.getElementById("menu-close");

    if (!menu || !openButton || !closeButton) return;

    const openMenu = () => {
        menu.classList.add("open");
        menu.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        closeButton.focus();
    };

    const closeMenu = () => {
        menu.classList.remove("open");
        menu.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        openButton.focus();
    };

    openButton.addEventListener("click", openMenu);
    closeButton.addEventListener("click", closeMenu);

    menu.addEventListener("click", event => {
        if (event.target === menu) closeMenu();
    });

    menu.querySelectorAll(".menu-links a").forEach(link => {
        link.addEventListener("click", closeMenu);
    });

    document.addEventListener("keydown", event => {
        if (event.key === "Escape" && menu.classList.contains("open")) {
            closeMenu();
        }
    });
})();
</script>
