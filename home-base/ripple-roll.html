<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Ripple Roll — Make the Ripple</title>
    <meta name="description" content="The Ripple Roll — small rolls, big ripples.">

    <style>
        * { box-sizing: border-box; }

        html {
            margin: 0;
            padding: 0;
            background: #01050b;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #01050b;
            color: #eefaff;
            font-family: Georgia, "Times New Roman", serif;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Cinematic background */
        .page {
            position: relative;
            min-height: 100vh;
            isolation: isolate;
            overflow: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            z-index: -3;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
        }

        .background-overlay {
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 5, 12, .78) 0%,
                    rgba(0, 8, 16, .38) 28%,
                    rgba(0, 5, 12, .50) 62%,
                    rgba(0, 3, 8, .90) 100%
                ),
                radial-gradient(
                    ellipse at 50% 45%,
                    rgba(20, 164, 205, .10),
                    transparent 58%
                );
            pointer-events: none;
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: .32;
            background-image:
                radial-gradient(circle at 12% 14%, rgba(255,255,255,.8) 0 1px, transparent 2px),
                radial-gradient(circle at 32% 8%, rgba(255,255,255,.65) 0 1px, transparent 2px),
                radial-gradient(circle at 71% 12%, rgba(255,255,255,.8) 0 1px, transparent 2px),
                radial-gradient(circle at 84% 24%, rgba(255,255,255,.65) 0 1px, transparent 2px);
            background-size: 260px 190px, 330px 230px, 290px 210px, 370px 260px;
        }

        /* Header */
        header {
            position: relative;
            z-index: 10;
            width: 100%;
            min-height: 92px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 6vw;
            background: linear-gradient(
                to bottom,
                rgba(1, 8, 15, .88),
                rgba(1, 8, 15, .18),
                transparent
            );
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 11px 18px;
            border: 1px solid rgba(82, 229, 255, .55);
            border-radius: 28px;
            background: rgba(2, 15, 25, .34);
            backdrop-filter: blur(5px);
            text-transform: uppercase;
            letter-spacing: .11em;
            font-size: 12px;
            transition: .25s ease;
        }

        .back-link:hover {
            border-color: #63e6ff;
            background: rgba(16, 55, 68, .48);
            box-shadow: 0 0 22px rgba(50, 211, 243, .22);
            transform: translateY(-1px);
        }

        .brand {
            position: absolute;
            left: 50%;
            top: 24px;
            transform: translateX(-50%);
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            text-transform: uppercase;
            letter-spacing: .22em;
            font-size: 11px;
            color: rgba(238,250,255,.72);
        }

        /* Main content */
        main {
            width: min(1200px, 92vw);
            margin: 0 auto;
            padding: 4vh 0 10vh;
        }

        .intro {
            text-align: center;
            margin-bottom: 42px;
            text-shadow: 0 0 22px rgba(60, 215, 250, .34);
        }

        .intro-kicker {
            margin: 0 0 12px;
            font-size: 13px;
            letter-spacing: .42em;
            text-transform: uppercase;
            color: #79eaff;
        }

        .intro h1 {
            margin: 0;
            font-size: clamp(46px, 8vw, 100px);
            font-weight: 400;
            letter-spacing: .12em;
            line-height: .95;
        }

        .intro p {
            margin: 22px auto 0;
            max-width: 700px;
            font-size: clamp(17px, 2vw, 22px);
            line-height: 1.7;
            color: rgba(238,250,255,.88);
        }

        /* Poster display */
        .poster-stage {
            width: min(820px, 100%);
            margin: 0 auto;
            padding: 18px;
            background: rgba(1, 7, 13, .54);
            border: 1px solid rgba(90, 224, 247, .38);
            box-shadow:
                0 0 35px rgba(0, 0, 0, .55),
                0 0 45px rgba(30, 195, 230, .10);
            backdrop-filter: blur(4px);
        }

        .poster-stage img {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid rgba(154, 239, 255, .25);
            box-shadow: 0 12px 40px rgba(0, 0, 0, .55);
        }

        .tagline {
            text-align: center;
            margin: 34px 0 0;
            font-size: clamp(20px, 2.6vw, 30px);
            letter-spacing: .16em;
            text-transform: uppercase;
            color: #dceff5;
            text-shadow: 0 0 18px rgba(77, 222, 250, .28);
        }

        .description {
            width: min(780px, 100%);
            margin: 26px auto 0;
            text-align: center;
            font-size: 18px;
            line-height: 1.8;
            color: rgba(238,250,255,.82);
        }

        footer {
            position: relative;
            z-index: 10;
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 6vw;
            background: rgba(1, 6, 12, .88);
            border-top: 1px solid rgba(61, 208, 239, .30);
            backdrop-filter: blur(7px);
        }

        footer a {
            font-size: 13px;
            letter-spacing: .13em;
            text-transform: uppercase;
            color: rgba(238,250,255,.82);
        }

        footer a:hover {
            color: #63e6ff;
            text-shadow: 0 0 14px rgba(70,224,250,.45);
        }

        @media (max-width: 760px) {
            header {
                min-height: 76px;
                padding: 12px 5vw;
            }

            .brand {
                display: none;
            }

            .back-link {
                font-size: 10px;
                padding: 9px 13px;
            }

            main {
                width: 94vw;
                padding-top: 3vh;
            }

            .intro {
                margin-bottom: 28px;
            }

            .intro h1 {
                font-size: clamp(40px, 13vw, 68px);
                letter-spacing: .08em;
            }

            .intro p {
                font-size: 16px;
                line-height: 1.65;
            }

            .poster-stage {
                padding: 8px;
            }

            .tagline {
                font-size: 18px;
                line-height: 1.4;
            }

            .description {
                font-size: 16px;
                line-height: 1.7;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <img class="background" src="images/ripple-roll-background.png" alt="" aria-hidden="true">
        <div class="background-overlay"></div>
        <div class="stars"></div>

        <header>
            <a class="back-link" href="index.html" aria-label="Back to The Ripple Well">
                ← The Ripple Well
            </a>
            <div class="brand">Make the Ripple</div>
        </header>

        <main>
            <section class="intro">
                <div class="intro-kicker">A Make the Ripple Project</div>
                <h1>THE RIPPLE ROLL</h1>
                <p>
                    Roll. Give. Make the Ripple.
                </p>
            </section>

            <section class="poster-stage" aria-label="The Ripple Roll poster">
                <img src="images/ripple-roll-poster.png" alt="The Ripple Roll poster">
            </section>

            <p class="tagline">Small Rolls. Big Ripples.</p>

            <p class="description">
                Every roll creates a ripple. Roll the D20, complete the matching act of kindness,
                and share your ripple online.
            </p>
        </main>

        <footer>
            <a href="index.html">Return to The Ripple Well</a>
        </footer>
    </div>
</body>
</html>
