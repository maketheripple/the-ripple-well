<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ripple Quest — Make the Ripple</title>
    <meta name="description" content="The Ripple Quest — Make the Ripple.">
    <style>
*{box-sizing:border-box}
html{margin:0;padding:0;background:#01050b;scroll-behavior:smooth}
body{margin:0;background:#01050b;color:#eefaff;font-family:Georgia,"Times New Roman",serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit}

/* SAME HOME BASE HEADER / MENU BAR */
#homebase-header{position:fixed;z-index:1000;top:0;left:0;width:100%;height:92px;display:flex;align-items:center;padding:10px 7vw;gap:35px;background:linear-gradient(to bottom,rgba(1,8,15,.82),rgba(1,8,15,.10),transparent);pointer-events:none}
#homebase-header>*{pointer-events:auto}
.brand-link{position:relative;display:flex;align-items:center;flex:0 0 auto;width:225px;z-index:1}
.brand-link::before{content:"";position:absolute;left:50%;top:calc(50% + 42px);width:245px;height:175px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(74,220,248,.42) 0%,rgba(74,220,248,.24) 28%,rgba(74,220,248,.10) 52%,transparent 76%);filter:blur(12px);pointer-events:none;z-index:-1}
.brand-link img{position:relative;width:225px;height:auto;display:block;transform:translateY(85px);filter:drop-shadow(0 0 10px rgba(55,219,246,.8)) drop-shadow(0 0 24px rgba(55,219,246,.55)) drop-shadow(0 0 42px rgba(55,219,246,.32))}
.desktop-nav{display:flex;align-items:center;justify-content:center;gap:clamp(10px,2.3vw,38px);flex:1;font-size:14px;letter-spacing:.11em;text-transform:uppercase;white-space:nowrap}
.desktop-nav a{opacity:.9;transition:.25s ease}.desktop-nav a:hover{opacity:1;color:#59e8ff;text-shadow:0 0 12px rgba(70,224,250,.6)}
.header-actions{display:flex;align-items:center;gap:22px}
.menu-button{width:42px;height:42px;border:0;background:transparent;display:grid;align-content:center;gap:6px;cursor:pointer}.menu-button span{display:block;width:30px;height:2px;background:#eefaff;margin:auto;box-shadow:0 0 7px rgba(255,255,255,.25)}

#quest-page{min-height:100vh;position:relative;background:#000 url("images/the-ripple-quest-background.png") center top / cover no-repeat;}
#quest-page::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.05),rgba(0,0,0,.12));z-index:1}
.quest-content{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:120px 6vw 90px}
.quest-title{width:min(820px,90vw);height:auto;display:block;margin:20px auto 55px;filter:drop-shadow(0 0 14px rgba(50,211,243,.22))}
.quest-guild{width:min(1250px,96vw);display:grid;grid-template-columns:repeat(4,1fr);gap:24px;align-items:end}
.quest-character{display:flex;align-items:flex-end;justify-content:center;min-width:0}
.quest-character img{display:block;width:100%;height:auto;max-height:620px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(50,211,243,.16));transition:transform .3s ease,filter .3s ease}
.quest-character:hover img{transform:translateY(-8px) scale(1.02);filter:drop-shadow(0 0 20px rgba(50,211,243,.34))}

#homebase-footer{position:relative;z-index:1100;width:100%;height:72px;display:flex;align-items:center;justify-content:flex-end;padding:0 5vw;background:rgba(1,6,12,.9);border-top:1px solid rgba(61,208,239,.38);backdrop-filter:blur(7px)}
.contact-link{font-size:16px;letter-spacing:.08em;border-left:1px solid rgba(65,212,240,.45);padding-left:28px}

/* SAME MENU OVERLAY */
#menu-overlay{position:fixed;inset:0;z-index:2500;display:flex;align-items:center;justify-content:center;background:rgba(0,5,12,.94);backdrop-filter:blur(12px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s ease,visibility .35s ease}
#menu-overlay.open{opacity:1;visibility:visible;pointer-events:auto}
.menu-panel{width:min(760px,88vw);text-align:center;padding:70px 30px 55px;position:relative}
.menu-close{position:absolute;right:0;top:0;width:46px;height:46px;border:1px solid rgba(110,225,246,.45);border-radius:50%;background:rgba(2,15,25,.4);color:#eefaff;font:32px/1 Arial,sans-serif;cursor:pointer}
.menu-close:hover{border-color:#63e6ff;box-shadow:0 0 10px rgba(70,224,250,.35)}
.menu-kicker{font-size:12px;letter-spacing:.38em;text-transform:uppercase;opacity:.6;margin-bottom:10px}
.menu-title{font-size:clamp(34px,5vw,58px);font-weight:400;letter-spacing:.16em;margin:0 0 45px;text-shadow:0 0 20px rgba(92,210,255,.35)}
.menu-links{display:flex;flex-direction:column;align-items:center;gap:22px}
.menu-links a{font-size:clamp(20px,3vw,30px);letter-spacing:.2em;text-transform:uppercase;transition:.25s ease}
.menu-links a:hover{color:#63e6ff;text-shadow:0 0 10px rgba(70,224,250,.65);transform:translateY(-2px)}

@media(max-width:1050px){
  #homebase-header{padding:16px 4vw;gap:15px}
  .brand-link,.brand-link img{width:190px}
  .brand-link::before{width:215px;height:155px}
  .brand-link img{transform:translateY(55px)}
  .desktop-nav{gap:14px;font-size:11px}
  .header-actions{gap:10px}
  }
@media(max-width:760px){
  #homebase-header{height:75px;padding:10px 5vw}
  .brand-link,.brand-link img{width:77.5px}
  .brand-link::before{width:88px;height:63px;top:calc(50% + 14px)}
  .brand-link img{transform:translateY(22.5px)}
  .desktop-nav{display:none}
  .header-actions{margin-left:auto}
    .menu-button{width:34px}
  .quest-content{padding:105px 5vw 55px}
  .quest-title{width:min(94vw,700px);margin-bottom:35px}
  .quest-guild{width:min(94vw,700px);grid-template-columns:repeat(2,1fr);gap:8px 12px}
  .quest-character img{max-height:430px}
  .contact-link{font-size:12px;padding-left:12px}
}
    </style>
</head>
<body>
    <header id="homebase-header">
        <a class="brand-link" href="index.html" aria-label="Make the Ripple Home">
            <img src="images/Make the Ripple Large Logo.png" alt="Make the Ripple">
        </a>

        <nav class="desktop-nav" aria-label="Main navigation">
            <a href="index.html#about">About</a>
            <a href="index.html#projects">Projects</a>
            <a href="index.html#socials">Socials</a>
            <a href="index.html#involved">Get Involved</a>
            <a href="index.html#support">Support</a>
        </nav>

        <div class="header-actions">
            <button id="menu-button" class="menu-button" type="button" aria-label="Open menu"><span></span><span></span><span></span></button>
        </div>
    </header>

    <div id="menu-overlay" aria-hidden="true">
        <div class="menu-panel" role="dialog" aria-modal="true" aria-label="Main menu">
            <button id="menu-close" class="menu-close" type="button" aria-label="Close menu">×</button>
            <div class="menu-kicker">Make the Ripple</div>
            <h2 class="menu-title">THE RIPPLE QUEST</h2>
            <nav class="menu-links" aria-label="Menu navigation">
                <a href="index.html#about">About</a>
                <a href="index.html#projects">Projects</a>
                <a href="index.html#socials">Socials</a>
                <a href="index.html#involved">Get Involved</a>
                <a href="index.html#support">Support</a>
            </nav>
        </div>
    </div>

    <main id="quest-page">
        <div class="quest-content">
            <img class="quest-title" src="images/the-ripple-quest-title.png" alt="The Ripple Quest">

            <div class="quest-guild" aria-label="The Ripple Quest Guild">
                <div class="quest-character"><img src="images/Auggie - The Rogue - AC.png" alt="Auggie — The Rogue"></div>
                <div class="quest-character"><img src="images/Evan - The Bard - AC.png" alt="Evan — The Bard"></div>
                <div class="quest-character"><img src="images/Pebs - The Paladin - AC.png" alt="Pebs — The Paladin"></div>
                <div class="quest-character"><img src="images/Rucca - The Druid - AC.png" alt="Rucca — The Druid"></div>
            </div>
        </div>
    </main>

    <footer id="homebase-footer">
        <a class="contact-link" href="mailto:info@maketheripple.com">Contact Us</a>
    </footer>

    <script>
    (() => {
        const menu = document.getElementById("menu-overlay");
        const openButton = document.getElementById("menu-button");
        const closeButton = document.getElementById("menu-close");
        if (!menu || !openButton || !closeButton) return;

        const openMenu = () => {
            menu.classList.add("open");
            menu.setAttribute("aria-hidden", "false");
            document.body.style.overflow = "hidden";
            closeButton.focus();
        };

        const closeMenu = () => {
            menu.classList.remove("open");
            menu.setAttribute("aria-hidden", "true");
            document.body.style.overflow = "";
            openButton.focus();
        };

        openButton.addEventListener("click", openMenu);
        closeButton.addEventListener("click", closeMenu);

        menu.addEventListener("click", event => {
            if (event.target === menu) closeMenu();
        });

        menu.querySelectorAll(".menu-links a").forEach(link => {
            link.addEventListener("click", closeMenu);
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape" && menu.classList.contains("open")) closeMenu();
        });
    })();
    </script>
    <script src="water.js"></script>
</body>
</html>
